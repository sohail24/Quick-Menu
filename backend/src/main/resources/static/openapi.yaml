openapi: 3.0.3
info:
  title: Quick Menu API
  version: "1.0.0"
  description: |
    Quick Menu backend API — QR-based menu, real-time orders (WebSocket), admin dashboards.
servers:
  - url: http://localhost:8080
    description: Local dev server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # Auth
    SignUpRequest:
      type: object
      required: [name,email,password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
    LoginRequest:
      type: object
      required: [email,password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        tokenType:
          type: string
        expiresInMs:
          type: integer
          format: int64

    # Domain models
    Restaurant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        timezone:
          type: string
        currency:
          type: string
        address:
          type: string

    Table:
      type: object
      properties:
        id:
          type: string
        restaurantId:
          type: string
        name:
          type: string
        qrUrl:
          type: string
          format: uri

    Category:
      type: object
      properties:
        id:
          type: string
        restaurantId:
          type: string
        name:
          type: string
        orderIndex:
          type: integer
    Dish:
      type: object
      properties:
        id:
          type: string
        restaurantId:
          type: string
        categoryId:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        imageUrl:
          type: string
        isAvailable:
          type: boolean
        prepTimeMins:
          type: integer

    OrderItemCreate:
      type: object
      properties:
        dishId:
          type: string
        quantity:
          type: integer
        note:
          type: string
      required: [dishId, quantity]

    CreateOrderRequest:
      type: object
      properties:
        tableId:
          type: string
        customerNote:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemCreate'
      required: [tableId, items]

    OrderItemResponse:
      type: object
      properties:
        dishId:
          type: string
        quantity:
          type: integer
        priceAtOrder:
          type: number
          format: double
        note:
          type: string

    OrderResponse:
      type: object
      properties:
        id:
          type: string
        restaurantId:
          type: string
        tableId:
          type: string
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, READY, SERVED, CANCELLED]
        totalAmount:
          type: number
          format: double
        placedAt:
          type: string
          format: date-time
        customerNote:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'

    UploadResponse:
      type: object
      properties:
        url:
          type: string
          format: uri

    AdminStatsResponse:
      type: object
      properties:
        ordersToday:
          type: integer
        revenueToday:
          type: number
          format: double

    TopDishDto:
      type: object
      properties:
        dishId:
          type: string
        name:
          type: string
        totalQty:
          type: integer
        totalRevenue:
          type: number
          format: double

    HourlyDto:
      type: object
      properties:
        hourStart:
          type: string
          format: date-time
        ordersCount:
          type: integer

    AdminMetricsResponse:
      type: object
      properties:
        topDishes:
          type: array
          items:
            $ref: '#/components/schemas/TopDishDto'
        hourlyOrders:
          type: array
          items:
            $ref: '#/components/schemas/HourlyDto'

  parameters:
    restaurantId:
      name: restaurantId
      in: path
      required: true
      schema:
        type: string
    tableId:
      name: tableId
      in: path
      required: true
      schema:
        type: string
    dishId:
      name: dishId
      in: path
      required: true
      schema:
        type: string
    orderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string

security:
  - bearerAuth: []

paths:

  /api/auth/signup:
    post:
      summary: Sign up (register)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Created — returns token (auto-login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad request

  /api/auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login success — returns token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /api/restaurants:
    post:
      summary: Create a restaurant (admin)
      tags: [Restaurants]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Restaurant'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
    get:
      summary: List restaurants (paginated)
      tags: [Restaurants]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
        - name: sort
          in: query
          schema:
            type: string
            default: id,asc
            description: "sort=property,asc|desc (repeatable)"
      responses:
        '200':
          description: Page of restaurants
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/Restaurant'
                  pageable:
                    type: object
                  totalElements:
                    type: integer

  /api/restaurants/{restaurantId}:
    parameters:
      - $ref: '#/components/parameters/restaurantId'
    get:
      summary: Get restaurant details
      tags: [Restaurants]
      responses:
        '200':
          description: Restaurant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '404':
          description: Not found
    patch:
      summary: Update restaurant
      tags: [Restaurants]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Restaurant'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
    delete:
      summary: Delete restaurant
      tags: [Restaurants]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted

  # Tables (QR)
  /api/restaurants/{restaurantId}/tables:
    parameters:
      - $ref: '#/components/parameters/restaurantId'
    post:
      summary: Create a table (generates QR url)
      tags: [Tables]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
    get:
      summary: List tables (paginated)
      tags: [Tables]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
        - name: sort
          in: query
          schema:
            type: string
            default: id,asc
      responses:
        '200':
          description: Page of tables
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/Table'
                  totalElements:
                    type: integer

  /api/restaurants/{restaurantId}/tables/{tableId}:
    parameters:
      - $ref: '#/components/parameters/restaurantId'
      - $ref: '#/components/parameters/tableId'
    get:
      summary: Get table
      tags: [Tables]
      responses:
        '200':
          description: Table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
    delete:
      summary: Delete table
      tags: [Tables]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted

  /api/restaurants/{restaurantId}/tables/{tableId}/qr.png:
    parameters:
      - $ref: '#/components/parameters/restaurantId'
      - $ref: '#/components/parameters/tableId'
    get:
      summary: Get table QR PNG (image/png)
      tags: [Tables]
      responses:
        '200':
          description: PNG image of QR (binary)
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Not found

  # Bell (customer pings staff)
  /api/{restaurantId}/tables/{tableId}/bell:
    parameters:
      - $ref: '#/components/parameters/restaurantId'
      - $ref: '#/components/parameters/tableId'
    post:
      summary: Ring the bell (customer) — posts bell event to websocket topic
      tags: [Bell]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
      responses:
        '200':
          description: Event sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  timestamp:
                    type: string
                    format: date-time

  # Categories & Dishes (menu)
  /api/{restaurantId}/categories:
    parameters:
      - $ref: '#/components/parameters/restaurantId'
    post:
      summary: Create category
      tags: [Menu]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    get:
      summary: List categories (paginated)
      tags: [Menu]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Page of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  totalElements:
                    type: integer

  /api/{restaurantId}/dishes:
    parameters:
      - $ref: '#/components/parameters/restaurantId'
    post:
      summary: Create dish (admin)
      tags: [Menu]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dish'
      responses:
        '201':
          description: Created dish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
    get:
      summary: List dishes (paginated)
      tags: [Menu]
      parameters:
        - name: includeUnavailable
          in: query
          schema: { type: boolean, default: false }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
        - name: sort
          in: query
          schema:
            type: string
            default: name,asc
      responses:
        '200':
          description: Page of dishes
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dish'
                  totalElements:
                    type: integer

  /api/{restaurantId}/dishes/{dishId}:
    parameters:
      - $ref: '#/components/parameters/restaurantId'
      - $ref: '#/components/parameters/dishId'
    patch:
      summary: Update dish (partial)
      tags: [Menu]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dish'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '404':
          description: Not found

  /api/{restaurantId}/dishes/{dishId}/availability:
    parameters:
      - $ref: '#/components/parameters/restaurantId'
      - $ref: '#/components/parameters/dishId'
    patch:
      summary: Toggle availability (admin/staff)
      tags: [Menu]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isAvailable:
                  type: boolean
      responses:
        '200':
          description: Updated availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  dishId:
                    type: string
                  isAvailable:
                    type: boolean

  /api/{restaurantId}/menu:
    parameters:
      - $ref: '#/components/parameters/restaurantId'
    get:
      summary: Get public menu (categories + dishes)
      tags: [Menu]
      parameters:
        - name: includeUnavailable
          in: query
          schema: { type: boolean, default: false }
        - name: tableId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Menu DTO
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  dishes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dish'

  # Orders
  /api/{restaurantId}/orders:
    parameters:
      - $ref: '#/components/parameters/restaurantId'
    post:
      summary: Place an order (customer)
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Validation error
    get:
      summary: List orders (paginated) (staff)
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, IN_PROGRESS, READY, SERVED, CANCELLED]
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
        - name: sort
          in: query
          schema:
            type: string
            default: placedAt,desc
      responses:
        '200':
          description: Page of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderResponse'
                  totalElements:
                    type: integer

  /api/{restaurantId}/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/restaurantId'
      - $ref: '#/components/parameters/orderId'
    get:
      summary: Get order details
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Not found
    patch:
      summary: Update order (status) (staff)
      tags: [Orders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [PENDING, IN_PROGRESS, READY, SERVED, CANCELLED]
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

  # Uploads
  /api/uploads:
    post:
      summary: Upload image (admin/staff). Returns accessible URL
      tags: [Uploads]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '413':
          description: Payload too large

  # Admin stats / metrics
  /api/admin/stats:
    get:
      summary: Simple admin stats (orders & revenue for today)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: restaurantId
          in: query
          required: true
          schema:
            type: string
        - name: timezone
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatsResponse'

  /api/admin/metrics:
    get:
      summary: Admin metrics — top dishes & hourly breakdown (last 24 hours)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: restaurantId
          in: query
          required: true
          schema:
            type: string
        - name: timezone
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMetricsResponse'

  # WebSocket: not an HTTP path, documented here for reference
  /ws:
    get:
      summary: STOMP WebSocket endpoint (WS/SockJS)
      description: |
        STOMP endpoint to connect for real-time events. Clients should use SockJS/STOMP to connect to /ws and subscribe to:
         - /topic/restaurants/{restaurantId}/orders
         - /topic/restaurants/{restaurantId}/bells
      responses:
        '200':
          description: Connect via WebSocket client

tags:
  - name: Auth
  - name: Restaurants
  - name: Tables
  - name: Menu
  - name: Orders
  - name: Uploads
  - name: Admin
  - name: Bell
  - name: WebSocket
