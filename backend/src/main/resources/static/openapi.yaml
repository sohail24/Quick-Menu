openapi: 3.0.3
info:
  title: Quick-Menu API
  version: "1.0.0"
  description: |
    Quick-Menu REST API — QR-based digital ordering system.
    Public menu endpoints are open; management endpoints require JWT bearer token with roles ADMIN or STAFF.
servers:
  - url: https://{host}
    variables:
      host:
        default: api.quickmenu.local
tags:
  - name: Auth
  - name: Restaurants
  - name: Tables
  - name: Menu
  - name: Orders
  - name: Uploads
  - name: Admin

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SignUpRequest:
      type: object
      required:
        - name
        - email
        - password
        - restaurantName
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        restaurantName:
          type: string
        planId:
          type: string
          nullable: true

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        tokenType:
          type: string
          default: Bearer
        expiresIn:
          type: integer

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - ADMIN
            - STAFF

    Restaurant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        ownerUserId:
          type: string
        timezone:
          type: string
        currency:
          type: string
        planId:
          type: string

    Table:
      type: object
      properties:
        id:
          type: string
        restaurantId:
          type: string
        name:
          type: string
        qrUrl:
          type: string
          format: uri

    Category:
      type: object
      properties:
        id:
          type: string
        restaurantId:
          type: string
        name:
          type: string
        orderIndex:
          type: integer

    Dish:
      type: object
      properties:
        id:
          type: string
        restaurantId:
          type: string
        categoryId:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        imageUrl:
          type: string
          format: uri
        tags:
          type: array
          items:
            type: string
        isAvailable:
          type: boolean
        prepTimeMins:
          type: integer

    OrderItem:
      type: object
      properties:
        dishId:
          type: string
        quantity:
          type: integer
        priceAtOrder:
          type: number
        note:
          type: string

    Order:
      type: object
      properties:
        id:
          type: string
        restaurantId:
          type: string
        tableId:
          type: string
        customerNote:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - IN_PROGRESS
            - READY
            - SERVED
            - CANCELLED
        totalAmount:
          type: number
        placedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string

security:
  - bearerAuth: []

paths:
  /api/auth/signup:
    post:
      tags:
        - Auth
      summary: Owner/Admin signup + create default restaurant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Created — returns JWT token and expiry information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad request — validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login to get JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful — returns JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials.

  /api/restaurants:
    post:
      tags:
        - Restaurants
      summary: Create restaurant (Admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                timezone:
                  type: string
                currency:
                  type: string
      responses:
        '201':
          description: Restaurant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
    get:
      tags:
        - Restaurants
      summary: List restaurants (Admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK — list of restaurants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'

  /api/restaurants/{restaurantId}:
    parameters:
      - name: restaurantId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Restaurants
      summary: Get restaurant details (public minimal)
      responses:
        '200':
          description: Restaurant details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '404':
          description: Restaurant not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/restaurants/{restaurantId}/tables:
    parameters:
      - name: restaurantId
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Tables
      summary: Create table + generate QR
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Table created with QR URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
    get:
      tags:
        - Tables
      summary: List tables
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK — list of tables for the restaurant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Table'

  /api/{restaurantId}/menu:
    parameters:
      - name: restaurantId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Menu
      summary: Public menu for a restaurant (categories + dishes). Filters out unavailable items by default.
      parameters:
        - name: includeUnavailable
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Menu payload (categories and dishes).
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  dishes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dish'

  /api/{restaurantId}/categories:
    parameters:
      - name: restaurantId
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Menu
      summary: Create category (Admin/Staff)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                orderIndex:
                  type: integer
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

  /api/{restaurantId}/dishes:
    parameters:
      - name: restaurantId
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Menu
      summary: Create dish (multipart) — returns created dish with imageUrl
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                categoryId:
                  type: string
                image:
                  type: string
                  format: binary
                tags:
                  type: string
      responses:
        '201':
          description: Dish created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'

  /api/{restaurantId}/dishes/{dishId}:
    parameters:
      - name: restaurantId
        in: path
        required: true
        schema:
          type: string
      - name: dishId
        in: path
        required: true
        schema:
          type: string
    patch:
      tags:
        - Menu
      summary: Update dish (price / availability / description)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                isAvailable:
                  type: boolean
                prepTimeMins:
                  type: integer
      responses:
        '200':
          description: Dish updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'

  /api/{restaurantId}/dishes/{dishId}/availability:
    parameters:
      - name: restaurantId
        in: path
        required: true
        schema:
          type: string
      - name: dishId
        in: path
        required: true
        schema:
          type: string
    patch:
      tags:
        - Menu
      summary: Toggle availability
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isAvailable
              properties:
                isAvailable:
                  type: boolean
      responses:
        '200':
          description: Updated availability.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dishId:
                    type: string
                  isAvailable:
                    type: boolean

  /api/{restaurantId}/orders:
    parameters:
      - name: restaurantId
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Orders
      summary: Customer places order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tableId
                - items
              properties:
                tableId:
                  type: string
                customerNote:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - dishId
                      - quantity
                    properties:
                      dishId:
                        type: string
                      quantity:
                        type: integer
                      note:
                        type: string
      responses:
        '201':
          description: Order created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Bad request — invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Orders
      summary: Staff list orders (protected)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - PENDING
              - IN_PROGRESS
              - READY
              - SERVED
              - CANCELLED
      responses:
        '200':
          description: List of orders for the restaurant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /api/{restaurantId}/orders/{orderId}:
    parameters:
      - name: restaurantId
        in: path
        required: true
        schema:
          type: string
      - name: orderId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Orders
      summary: Get order details (staff or customer)
      responses:
        '200':
          description: Order details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Orders
      summary: Update order status (staff)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - PENDING
                    - IN_PROGRESS
                    - READY
                    - SERVED
                    - CANCELLED
      responses:
        '200':
          description: Order status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid status update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/{restaurantId}/tables/{tableId}/bell:
    parameters:
      - name: restaurantId
        in: path
        required: true
        schema:
          type: string
      - name: tableId
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Orders
      summary: Customer rings bell — creates a bell event and notifies staff
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
      responses:
        '200':
          description: Bell event emitted to staff.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  timestamp:
                    type: string
                    format: date-time

  /api/uploads:
    post:
      tags:
        - Uploads
      summary: Upload image (admin/staff) — returns URL (or use direct Cloudinary client upload)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File uploaded — returns accessible URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri

  /api/admin/stats:
    get:
      tags:
        - Admin
      summary: Simple analytics (orders count / revenue)
      security:
        - bearerAuth: []
      parameters:
        - name: restaurantId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Analytics summary for the restaurant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ordersToday:
                    type: integer
                  revenueToday:
                    type: number
        '400':
          description: Bad request — missing or invalid params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
