spring:
  application:
    name: quick-menu

  datasource:
    url: jdbc:h2:mem:quickmenu;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

springdoc:
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs     # not used when using static, but safe to keep

jwt:
  secret: "change-this-to-a-long-secure-secret-at-least-32-chars"
  expirationMs: 3600000  # 1 hour

websocket:
  allowed-origins: "*"

app:
  base-url: http://localhost:8080