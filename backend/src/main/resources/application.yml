spring:
  application:
    name: quick-menu
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_ID}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: jdbc:h2:mem:quickmenu;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
# file upload / post size limits
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  tomcat:
    # Accept POST bodies up to ~10MB (bytes)
    max-http-post-size: 10485760
    # -1 means unlimited swallowing of request body on error; helps avoid some 413 issues
    max-swallow-size: -1

#springdoc:
#  swagger-ui:
#    url: /openapi.yaml
#    path: /swagger-ui.html
#  api-docs:
#    path: /v3/api-docs     # not used when using static, but safe to keep

jwt:
  secret: "change-this-to-a-long-secure-secret-at-least-32-chars"
  expirationMs: 3600000  # 1 hour

websocket:
  allowed-origins: "*"

app:
  uploads-dir: ./uploads
  base-url: http://localhost:8080
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:your-cloud-name}
    api-key: ${CLOUDINARY_API_KEY:your-api-key}
    api-secret: ${CLOUDINARY_API_SECRET:your-api-secret}
  cors:
    allowed-origins: http://localhost:5173
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:} # Provide this in .env
    huggingface:
      token: ${HUGGING_FACE_TOKEN:} # Provide this in .env

# Resilience4j Config
resilience4j:
  retry:
    instances:
      aiService:
        max-attempts: 3
        wait-duration: 1s
  timelimiter:
    instances:
      aiService:
        timeout-duration: 5s

# Demo data configuration
demo:
  data:
    enabled: true
    restore-interval-minutes: 30

# Stripe Configuration
stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_dummy}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_dummy}

  # RabbitMQ — localhost defaults for local development
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  # Redis — localhost defaults for local development
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

