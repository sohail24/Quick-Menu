spring:
  application:
    name: quick-menu
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_ID}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: jdbc:h2:mem:quickmenu;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
# file upload / post size limits
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  tomcat:
    # Accept POST bodies up to ~10MB (bytes)
    max-http-post-size: 10485760
    # -1 means unlimited swallowing of request body on error; helps avoid some 413 issues
    max-swallow-size: -1

#springdoc:
#  swagger-ui:
#    url: /openapi.yaml
#    path: /swagger-ui.html
#  api-docs:
#    path: /v3/api-docs     # not used when using static, but safe to keep

jwt:
  secret: "change-this-to-a-long-secure-secret-at-least-32-chars"
  expirationMs: 3600000  # 1 hour

websocket:
  allowed-origins: "*"

app:
  uploads-dir: ./uploads
  base-url: http://localhost:8080
  cors:
    allowed-origins: http://localhost:5173

# Demo data configuration
demo:
  data:
    enabled: true
    restore-interval-minutes: 30


