spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quickmenu}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  port: ${PORT:8080}
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

# Demo data configuration
demo:
  data:
    enabled: ${DEMO_DATA_ENABLED:true}
    restore-interval-minutes: ${DEMO_DATA_RESTORE_INTERVAL_MINUTES:30}
