app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
    huggingface:
      token: ${HUGGING_FACE_TOKEN:}
  bell:
    cooldown-seconds: ${BELL_INITIAL_COOLDOWN:5}
    max-cooldown-seconds: ${BELL_MAX_COOLDOWN:120}
    reset-window-minutes: ${BELL_RESET_WINDOW:2}


spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quickmenu}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:secret}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  # SendGrid Configuration
  sendgrid:
    api-key: ${SENDGRID_API_KEY:}

  # RabbitMQ — Message Broker for async event publishing
  # Events flow: backend (producer) → RabbitMQ → notification-service (consumer) → WebSocket → browser
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    # Publisher confirms: RabbitMQ ACKs back when message is durably stored
    # This gives us at-least-once delivery guarantee on the producer side
    publisher-confirm-type: correlated
    publisher-returns: true

  # Redis — Distributed state store
  # Used for:
  #   1. Bell rate-limiting (TTL keys replace in-memory ConcurrentHashMap)
  #   2. JWT blacklist on logout (future: gateway checks this)
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms  # connection timeout — fail fast if Redis is down


jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-secure-secret-at-least-32-chars}
  expirationMs: ${JWT_EXPIRATION_MS:3600000}

websocket:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

resilience4j:
  ratelimiter:
    instances:
      authApi:
        limit-for-period: 10
        limit-refresh-period: 1m
        timeout-duration: 0
      aiApi:
        limit-for-period: 5
        limit-refresh-period: 1m
        timeout-duration: 0
  retry:
    instances:
      aiService:
        max-attempts: 3
        wait-duration: 1s
  timelimiter:
    instances:
      aiService:
        timeout-duration: 5s

server:

  port: ${PORT:8080}

# Demo data configuration
demo:
  data:
    enabled: ${DEMO_DATA_ENABLED:true}
    restore-interval-minutes: ${DEMO_DATA_RESTORE_INTERVAL_MINUTES:30}

# Stripe Configuration
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
