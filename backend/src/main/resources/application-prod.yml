app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
    huggingface:
      token: ${HUGGING_FACE_TOKEN:}
  bell:
    cooldown-seconds: ${BELL_INITIAL_COOLDOWN:5}
    max-cooldown-seconds: ${BELL_MAX_COOLDOWN:120}
    reset-window-minutes: ${BELL_RESET_WINDOW:2}


spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quickmenu}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:secret}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  # SendGrid Configuration
  sendgrid:
    api-key: ${SENDGRID_API_KEY:}

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-secure-secret-at-least-32-chars}
  expirationMs: ${JWT_EXPIRATION_MS:3600000}

websocket:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

resilience4j:
  ratelimiter:
    instances:
      authApi:
        limit-for-period: 10
        limit-refresh-period: 1m
        timeout-duration: 0
      aiApi:
        limit-for-period: 5
        limit-refresh-period: 1m
        timeout-duration: 0
  retry:
    instances:
      aiService:
        max-attempts: 3
        wait-duration: 1s
  timelimiter:
    instances:
      aiService:
        timeout-duration: 5s

server:

  port: ${PORT:8080}

# Demo data configuration
demo:
  data:
    enabled: ${DEMO_DATA_ENABLED:true}
    restore-interval-minutes: ${DEMO_DATA_RESTORE_INTERVAL_MINUTES:30}

# Stripe Configuration
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
