spring:
  application:
    name: bell-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/quickmenu
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # IMPORTANT: validate only — never recreate the shared table
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

server:
  port: ${SERVER_PORT:8085}

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-secure-secret-at-least-32-chars}

app:
  bell:
    cooldown-seconds: 20
    max-cooldown-seconds: 600

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
